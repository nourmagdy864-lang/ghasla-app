<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>هدية يومية — Car Care</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .scan-btn-big {
      width: 160px; height: 160px; border-radius: 50%; border: none; font-size: 56px; cursor: pointer;
      margin: 20px auto; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-lg); transition: all 0.3s; position: relative; overflow: hidden;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: #fff;
    }
    .scan-btn-big:active { transform: scale(0.95); }
    .scan-btn-big:disabled { opacity: 0.5; cursor: not-allowed; }
    .pulse-ring {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      border: 3px solid currentColor; animation: pulse-ring 2s infinite; opacity: 0;
    }
    @keyframes pulse-ring { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
    .stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
    .stat-mini { background: white; border-radius: 14px; padding: 14px 8px; text-align: center; border: 1px solid var(--border); }
    .stat-mini .val { font-size: 22px; font-weight: 800; color: var(--primary); }
    .stat-mini .lbl { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .locked-message {
      background: #FEF3C7; border: 2px solid #F59E0B; border-radius: 16px; padding: 20px; text-align: center; margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="water-bg"></div>
  <div class="app-container">

    <header class="header">
      <div class="header-content">
        <a href="index.html" class="logo">
          <div class="logo-icon"><img src="assets/logo.jpg" alt="Car Care" style="width:100%;height:100%;object-fit:cover;border-radius:12px;"></div>
          <div class="logo-text">Car Care</div>
        </a>
      </div>
    </header>

    <div style="padding: 20px 16px;">

      <!-- Not logged in -->
      <div class="locked-message" id="loginNeededBox" style="display: none;">
        <div style="font-size: 48px; margin-bottom: 12px;">🎁</div>
        <h3 style="font-size: 16px; margin-bottom: 8px;">عندك هدية مستنياك!</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">سجّل دخولك أو افتح حساب جديد الأول عشان تاخدها</p>
        <div style="display: flex; gap: 10px;">
          <a href="login.html" class="btn btn-secondary" style="flex:1;">دخول</a>
          <a href="signup.html" class="btn btn-primary" style="flex:1;">حساب جديد</a>
        </div>
      </div>

      <!-- Scan Section -->
      <div id="scanSection" style="display: none; text-align: center;">
        <h1 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">🎁 هدية يومية!</h1>
        <p style="color: var(--text-muted); margin-bottom: 16px;">اضغط الزر وخد نقاط هدية كل يوم</p>

        <button class="scan-btn-big" id="scanBtn" onclick="claimDaily()">
          <span class="pulse-ring"></span>
          🎁
        </button>

        <p style="font-size: 13px; color: var(--text-muted);">مرة واحدة بس في اليوم ✨</p>

        <div class="stats-row" id="statsRow" style="display: none;">
          <div class="stat-mini">
            <div class="val" id="userPoints">—</div>
            <div class="lbl">نقطة</div>
          </div>
          <div class="stat-mini">
            <div class="val" id="userVisits">—</div>
            <div class="lbl">زيارة</div>
          </div>
        </div>
      </div>

      <!-- Already Claimed -->
      <div id="claimedBox" style="display: none; text-align: center;">
        <div style="font-size: 64px; margin-bottom: 12px;">🎉</div>
        <h2 style="font-size: 20px; font-weight: 800; color: var(--success);">تمام! خدت هديتك</h2>
        <p style="color: var(--text-muted); margin-top: 8px;">تعال بكرة تاخد هدية تانية!</p>
        <a href="dashboard.html" class="btn btn-secondary" style="margin-top: 16px;">شوف رصيدك</a>
      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API = '';
    const token = localStorage.getItem('token');

    // لو الكود ده جاي من QR بتاع موظف معين، نحفظ رقمه عشان نستخدمه وقت التسجيل
    const urlParams = new URLSearchParams(window.location.search);
    const refEmp = urlParams.get('emp');
    if (refEmp) sessionStorage.setItem('refEmp', refEmp);

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    async function init() {
      if (!token) {
        sessionStorage.setItem('pendingBonus', '1');
        document.getElementById('loginNeededBox').style.display = 'block';
        return;
      }
      try {
        const res = await fetch(API + '/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
        const data = await res.json();
        if (data.customer) {
          document.getElementById('userPoints').textContent = data.customer.points || 0;
          document.getElementById('statsRow').style.display = 'grid';
          document.getElementById('scanSection').style.display = 'block';

          // لو العميل مسح كود موظف ومش تابع لحد قبل كده، يتسجل تحته تلقائي
          if (refEmp && !data.myEmployee) {
            fetch(API + '/api/customer/assign-employee', {
              method: 'POST',
              headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
              body: JSON.stringify({ employeeId: refEmp })
            }).catch(() => {});
          }

          const actRes = await fetch(API + '/api/activity', { headers: { 'Authorization': 'Bearer ' + token } });
          const actData = await actRes.json();
          const visits = (actData.items || []).filter(t => t.type === 'earn').length;
          document.getElementById('userVisits').textContent = visits;
        } else {
          sessionStorage.setItem('pendingBonus', '1');
          document.getElementById('loginNeededBox').style.display = 'block';
        }
      } catch (e) {
        sessionStorage.setItem('pendingBonus', '1');
        document.getElementById('loginNeededBox').style.display = 'block';
      }
    }

    async function claimDaily() {
      const btn = document.getElementById('scanBtn');
      btn.disabled = true;
      try {
        const res = await fetch(API + '/api/customer/claim-bonus', {
          method: 'POST', headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.customer) document.getElementById('userPoints').textContent = data.customer.points;
        showToast(data.message, data.alreadyClaimed ? 'warning' : 'success');
        if (!data.alreadyClaimed) {
          document.getElementById('scanSection').style.display = 'none';
          document.getElementById('claimedBox').style.display = 'block';
        }
      } catch (e) {
        showToast('خطأ في الاتصال', 'error');
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
